name: Build Tag Explorer
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore TagExplorer/TagExplorer.sln
      - name: Build
        run: dotnet build TagExplorer/TagExplorer.sln -c Release --no-restore
      - name: Publish self-contained x64 app
        run: dotnet publish TagExplorer/src/TagExplorer/TagExplorer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/TagExplorer
      - uses: actions/upload-artifact@v4
        with:
          name: TagExplorer-win-x64
          path: artifacts/TagExplorer/**